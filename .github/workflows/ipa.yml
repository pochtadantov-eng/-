name: Build iOS .ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'ios-wrapper/**'
      - '.github/workflows/ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-wrapper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ios-wrapper/package.json'

      - name: Install npm deps
        run: npm install --no-audit --no-fund --no-progress

      - name: Stage PWA files into www/
        run: |
          mkdir -p www
          cp ../index.html www/
          cp ../manifest.webmanifest www/
          cp ../sw.js www/
          cp -R ../icons www/

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios-wrapper/ios/App
        run: pod install

      - name: Build unsigned .app
        working-directory: ios-wrapper/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package .app into .ipa
        working-directory: ios-wrapper/ios/App
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH" || { echo "App bundle not found at $APP_PATH"; find build -name '*.app'; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr TBank-unsigned.ipa Payload
          ls -lh TBank-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: TBank-unsigned-ipa
          path: ios-wrapper/ios/App/TBank-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
